name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build Windows package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build_windows.ps1 -PythonExecutable "$env:pythonLocation\python.exe" -SkipInstaller
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HADocs-${{ github.ref_name }}-win64
          path: |
            dist/windows/portable/*.zip
            dist/windows/manifests/*.sha256
