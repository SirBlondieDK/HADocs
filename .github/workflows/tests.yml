name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Debug environment
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nRepository contents:"
          Get-ChildItem

          Write-Host "`nPython version:"
          python --version

          Write-Host "`nImport test:"
          python -c "import tools_cleanup; print(tools_cleanup.__file__)"

      - name: Run tests
        run: python -m pytest