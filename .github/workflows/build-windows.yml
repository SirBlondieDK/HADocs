name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Build canonical Windows payload
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer/build_windows.ps1 -PythonExecutable "$env:pythonLocation\python.exe" -SkipInstaller

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HADocs-Windows
          path: |
            dist/windows/staging/HADocs
            dist/windows/portable/*.zip
            dist/windows/manifests/*.sha256
