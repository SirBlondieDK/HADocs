name: HADocs
version: "0.17.0-rc2"
slug: hadocs
description: Local Home Assistant analysis, diagnostics and stability platform
url: https://github.com/SirBlondieDK/HADocs
stage: experimental

startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64

homeassistant_api: true

ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-multiple
panel_title: HADocs

map:
  - type: share
    read_only: false
  - type: addon_config
    read_only: false

options:
  project_name: My Smart Home
  output_directory: /share/hadocs
  scan_on_start: false
  hask_database_initialize: false
  hask_database_enabled: false
  hask_database_path: /config/hadocs.db
  hask_database_installation_ref: home-assistant-app
  hask_enabled: false
  hask_preview_enabled: false
  hask_bundle_path: /config/hask-bundle
  hask_candidate_evidence_enabled: false
  hask_native_integration_status_enabled: false

schema:
  project_name: str
  output_directory: str
  scan_on_start: bool
  hask_database_initialize: bool
  hask_database_enabled: bool
  hask_database_path: str
  hask_database_installation_ref: str
  hask_enabled: bool
  hask_preview_enabled: bool
  hask_bundle_path: str
  hask_candidate_evidence_enabled: bool
  hask_native_integration_status_enabled: bool
